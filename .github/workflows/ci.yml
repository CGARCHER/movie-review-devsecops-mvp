name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movie-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Probar normalización y política
        run: python -m unittest discover -s tests -v

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar y probar
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Guardar JAR y resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: movie-ci-${{ github.sha }}
          path: |
            target/*.jar
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagen
        run: docker build --tag movie-review:${{ github.sha }} .
      - name: Comprobar usuario de ejecucion
        run: |
          test "$(docker image inspect movie-review:${{ github.sha }} --format '{{.Config.User}}')" = "spring:spring"

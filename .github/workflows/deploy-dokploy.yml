name: Deploy to Dokploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de destino
        required: true
        type: choice
        options: [staging, production]
      accept_risk:
        description: Acepto los hallazgos del análisis
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: spring-boot-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - name: Limitar producción a main
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Producción solo se despliega desde main."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Buscar el último análisis de main
        id: security-run
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'security.yml',
              head_sha: context.sha,
              per_page: 10
            });

            const run = result.data.workflow_runs
              .filter(item => item.head_branch === 'main' && item.event !== 'pull_request')
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];

            if (!run) {
              core.setFailed(`No existe un análisis de seguridad para el commit ${context.sha}.`);
            } else if (run.status !== 'completed' || !['success', 'failure'].includes(run.conclusion)) {
              core.setFailed(`El último análisis no terminó correctamente: ${run.html_url}`);
            } else {
              core.setOutput('run-id', String(run.id));
              // Un resultado rojo puede deberse a hallazgos que el responsable acepte.
              core.info(`Análisis que se va a revisar: ${run.html_url}`);
            }
      - name: Descargar decisión de seguridad
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spring-boot-security-report-${{ github.sha }}
          path: security-report
          repository: ${{ github.repository }}
          run-id: ${{ steps.security-run.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Comprobar el informe y la aceptación del riesgo
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ACCEPT_RISK: ${{ inputs.accept_risk }}
          SECURITY_RUN_ID: ${{ steps.security-run.outputs.run-id }}
        with:
          script: |
            const authorize = require('./scripts/authorize_deployment.cjs');
            await authorize({github, context, core, runId: Number(process.env.SECURITY_RUN_ID), acceptRisk: process.env.ACCEPT_RISK === 'true'});
      - name: Comprobar configuracion
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          test -n "$DOKPLOY_URL"
          test -n "$DOKPLOY_API_KEY"
          test -n "$DOKPLOY_COMPOSE_ID"
          test -n "$DEPLOY_HEALTH_URL"
      - name: Desplegar el commit y esperar a Dokploy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        with:
          script: |
            const deploy = require('./scripts/deploy_dokploy.cjs');
            await deploy({github, context, core});
      - name: Comprobar que la aplicación responde
        shell: bash
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$DEPLOY_HEALTH_URL" ]; then
            echo "Falta la variable DEPLOY_HEALTH_URL en el entorno ${{ inputs.environment }}."
            exit 1
          fi

          echo "Dokploy ha terminado. Comprobando la disponibilidad de la aplicación..."

          for intento in $(seq 1 12); do
            echo "Comprobación $intento de 12: $DEPLOY_HEALTH_URL"
            if curl --fail --silent --max-time 10 "$DEPLOY_HEALTH_URL" \
              | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "La aplicación está disponible y comunica el estado UP."
              exit 0
            fi
            sleep 10
          done

          echo "La aplicación no ha comunicado el estado UP después del despliegue."
          exit 1

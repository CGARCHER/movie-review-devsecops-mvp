name: Deploy to Dokploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de destino
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  actions: read

concurrency:
  group: movie-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Verificar seguridad antes de producción
        if: inputs.environment == 'production'
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'security.yml',
              head_sha: context.sha,
              status: 'completed',
              per_page: 10
            });

            const run = result.data.workflow_runs
              .filter(item => item.conclusion !== null)
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];

            if (!run) {
              core.setFailed(`No existe un análisis de seguridad completado para el commit ${context.sha}.`);
            } else if (run.conclusion !== 'success') {
              core.setFailed(`El análisis de seguridad no está aprobado: ${run.conclusion}. Ejecución: ${run.html_url}`);
            } else {
              core.info(`Análisis de seguridad aprobado: ${run.html_url}`);
            }
      - name: Comprobar configuracion
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: test -n "$DOKPLOY_DEPLOY_WEBHOOK"
      - name: Solicitar despliegue
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: curl --fail-with-body --silent --show-error --retry 3 -X POST "$DOKPLOY_DEPLOY_WEBHOOK"

name: Deploy to Dokploy

on:
  workflow_run:
    workflows: ["Seguridad DevSecOps"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de destino
        required: true
        type: choice
        options: [staging, production]
      accept_risk:
        description: Acepto los hallazgos del análisis (solo main)
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: spring-boot-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorize:
    # Reutiliza la comprobación del informe y la aceptación de main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/authorize-main.yml
    with:
      accept_risk: ${{ inputs.accept_risk || false }}

  deploy:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    env:
      DEPLOY_SHA: ${{ needs.authorize.outputs.sha }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 20
    steps:
      - name: Limitar producción a main
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ] && [ "$DEPLOY_REF" != "refs/heads/main" ]; then
            echo "Producción solo se despliega desde main."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Comprobar configuracion
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          test -n "$DOKPLOY_URL"
          test -n "$DOKPLOY_API_KEY"
          test -n "$DOKPLOY_COMPOSE_ID"
          test -n "$DEPLOY_HEALTH_URL"
      - name: Desplegar el commit y esperar a Dokploy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        with:
          script: |
            const deploy = require('./scripts/deploy_dokploy.cjs');
            await deploy({github, context: {...context, repo: context.repo, sha: process.env.DEPLOY_SHA, ref: process.env.DEPLOY_REF}, core});
      - name: Comprobar que la aplicación responde
        shell: bash
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$DEPLOY_HEALTH_URL" ]; then
            echo "Falta la variable DEPLOY_HEALTH_URL en el entorno ${{ inputs.environment || 'production' }}."
            exit 1
          fi

          echo "Dokploy ha terminado. Comprobando la disponibilidad de la aplicación..."

          for intento in $(seq 1 12); do
            echo "Comprobación $intento de 12: $DEPLOY_HEALTH_URL"
            if curl --fail --silent --max-time 10 "$DEPLOY_HEALTH_URL" \
              | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "La aplicación está disponible y comunica el estado UP."
              exit 0
            fi
            sleep 10
          done

          echo "La aplicación no ha comunicado el estado UP después del despliegue."
          exit 1

name: Deploy to Dokploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de destino
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  actions: read

concurrency:
  group: spring-boot-deploy-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Verificar seguridad antes de producción
        id: security-run
        if: inputs.environment == 'production'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'security.yml',
              head_sha: context.sha,
              status: 'completed',
              per_page: 10
            });

            const run = result.data.workflow_runs
              .filter(item => item.conclusion !== null)
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];

            if (!run) {
              core.setFailed(`No existe un análisis de seguridad completado para el commit ${context.sha}.`);
            } else if (run.conclusion !== 'success') {
              core.setFailed(`El análisis de seguridad no está aprobado: ${run.conclusion}. Ejecución: ${run.html_url}`);
            } else {
              core.setOutput('run-id', String(run.id));
              core.info(`Análisis de seguridad aprobado: ${run.html_url}`);
            }
      - name: Descargar decisión de seguridad
        if: inputs.environment == 'production'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spring-boot-security-report-${{ github.sha }}
          path: security-report
          repository: ${{ github.repository }}
          run-id: ${{ steps.security-run.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Exigir estado APPROVED
        if: inputs.environment == 'production'
        shell: bash
        run: |
          DECISION="$(find security-report -name decision.json -print -quit)"
          if [ -z "$DECISION" ]; then
            echo "No se encuentra decision.json en el informe de seguridad."
            exit 1
          fi

          STATUS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", "UNKNOWN"))' "$DECISION")"
          echo "Estado de la política para ${{ github.sha }}: $STATUS"
          if [ "$STATUS" != "APPROVED" ]; then
            echo "Producción requiere un estado APPROVED."
            exit 1
          fi
      - name: Comprobar configuracion
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: test -n "$DOKPLOY_DEPLOY_WEBHOOK"
      - name: Solicitar despliegue
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: curl --fail-with-body --silent --show-error --retry 3 -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
      - name: Comprobar que la aplicación responde
        shell: bash
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$DEPLOY_HEALTH_URL" ]; then
            echo "Falta la variable DEPLOY_HEALTH_URL en el entorno ${{ inputs.environment }}."
            exit 1
          fi

          echo "Esperando a que Dokploy actualice la aplicación..."
          sleep 20

          for intento in $(seq 1 12); do
            echo "Comprobación $intento de 12: $DEPLOY_HEALTH_URL"
            if curl --fail --silent --max-time 10 "$DEPLOY_HEALTH_URL" \
              | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "La aplicación está disponible y comunica el estado UP."
              exit 0
            fi
            sleep 10
          done

          echo "La aplicación no ha comunicado el estado UP después del despliegue."
          exit 1

name: Security analysis (asynchronous)

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movie-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check semgrep==1.170.0
      - name: Analizar codigo real
        run: |
          mkdir -p reports/sast
          semgrep scan --config security/semgrep.yml --json \
            --output reports/sast/semgrep.json src
          test -s reports/sast/semgrep.json
      - name: Validar fixture SAST
        run: |
          mkdir -p reports/demo/sast
          semgrep scan --config security/semgrep.yml --json \
            --output reports/demo/sast/semgrep-fixture.json security-fixtures/sast
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/demo/sast/semgrep-fixture.json").read_text(encoding="utf-8"))
          findings = report.get("results", [])
          expected = {
              "tfm-java-command-injection",
              "tfm-java-hardcoded-secret",
              "tfm-java-weak-md5",
          }
          detected = {item.get("check_id", "").split(".")[-1] for item in findings}
          missing = sorted(expected - detected)
          if missing:
              raise SystemExit(f"Semgrep no detecto los fixtures esperados: {', '.join(missing)}")
          print(f"Fixtures SAST detectados: {len(findings)}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: movie-sast
          path: |
            reports/sast/
            reports/demo/sast/
          retention-days: 30

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: movie-review-nvd-sca
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Preparar clave de cache de la NVD
        id: nvd-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restaurar datos de Dependency-Check
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-${{ steps.nvd-cache-date.outputs.date }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-
      - name: Analizar dependencias reales
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          NVD_ARGS=(-DnvdApiDelay=3500 -DnvdMaxRetryCount=20 -DnvdValidForHours=24)
          if [ -n "$NVD_API_KEY" ]; then NVD_ARGS+=(-DnvdApiKey="$NVD_API_KEY"); fi
          for attempt in 1 2 3; do
            if mvn --batch-mode --no-transfer-progress "${NVD_ARGS[@]}" \
              -DskipTests package org.owasp:dependency-check-maven:12.2.2:check; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency-Check no pudo actualizar la NVD tras 3 intentos." >&2
              exit 1
            fi
            echo "Reintentando Dependency-Check ($attempt/3) tras un fallo temporal de la NVD..."
            sleep 30
          done
          mkdir -p reports/sca
          cp target/dependency-check/dependency-check-report.* reports/sca/ 2>/dev/null || true
          test -s reports/sca/dependency-check-report.json
      - name: Validar fixture SCA
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          NVD_ARGS=(-DnvdApiDelay=3500 -DnvdMaxRetryCount=20 -DnvdValidForHours=24)
          if [ -n "$NVD_API_KEY" ]; then NVD_ARGS+=(-DnvdApiKey="$NVD_API_KEY"); fi
          mkdir -p reports/demo/sca
          mvn --batch-mode --no-transfer-progress "${NVD_ARGS[@]}" \
            -f security-fixtures/sca/pom.xml \
            org.owasp:dependency-check-maven:12.2.2:check \
            -Dformat=JSON -DoutputDirectory="${PWD}/reports/demo/sca" \
            -DfailBuildOnCVSS=11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: movie-sca
          path: |
            reports/sca/
            reports/demo/sca/
          if-no-files-found: warn
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag movie-review:${{ github.sha }} .
      - run: mkdir -p reports/container
      - name: Analizar imagen con Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/reports/container:/reports" \
            aquasec/trivy:0.65.0 \
            image \
            --format json \
            --output /reports/trivy.json \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-code 0 \
            movie-review:${{ github.sha }}
          test -s reports/container/trivy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: movie-container
          path: reports/container/
          retention-days: 30

  aggregate:
    if: always()
    needs: [sast, sca, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: movie-*
          path: downloaded
      - name: Reunir resultados reales
        shell: bash
        run: |
          mkdir -p reports/{sast,sca,container}
          find downloaded/movie-sast -name semgrep.json \
            -exec cp {} reports/sast/semgrep.json \; 2>/dev/null || true
          find downloaded/movie-sca -name dependency-check-report.json \
            -exec cp {} reports/sca/dependency-check-report.json \; 2>/dev/null || true
          find downloaded/movie-container -name trivy.json \
            -exec cp {} reports/container/trivy.json \; 2>/dev/null || true
      - name: Normalizar y evaluar
        run: |
          python scripts/validate_reports.py
          python scripts/normalize_findings.py --commit "${{ github.sha }}"
          python scripts/mock_remediation.py
          python scripts/evaluate_policy.py --enforce
      - name: Publicar resumen visual de seguridad
        if: always()
        shell: bash
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          findings_path = Path("reports/normalized/findings.json")
          decision_path = Path("reports/normalized/decision.json")
          analyzer_path = Path("reports/normalized/analyzer-status.json")
          findings_data = json.loads(findings_path.read_text(encoding="utf-8")) if findings_path.exists() else {}
          decision_data = json.loads(decision_path.read_text(encoding="utf-8")) if decision_path.exists() else {}
          analyzer_data = json.loads(analyzer_path.read_text(encoding="utf-8")) if analyzer_path.exists() else {}

          summary = findings_data.get("summary", {})
          counts = summary.get("bySeverity", {})
          findings = findings_data.get("findings", [])
          status = decision_data.get("status", "UNKNOWN")
          analyzer_results = {
              "SAST": os.environ.get("SAST_RESULT", "unknown"),
              "SCA": os.environ.get("SCA_RESULT", "unknown"),
              "Container": os.environ.get("CONTAINER_RESULT", "unknown"),
          }
          technical_failure = any(result != "success" for result in analyzer_results.values())
          if technical_failure or analyzer_data.get("status") != "SUCCESS":
              status = "ANALYSIS_ERROR"
          status_icon = {
              "APPROVED": "✅",
              "REVIEW_REQUIRED": "⚠️",
              "BLOCKED": "❌",
              "ANALYSIS_ERROR": "❌",
          }.get(status, "❔")

          def cell(value):
              return str(value or "No disponible").replace("|", "\\|").replace("\n", " ")

          lines = [
              "## Resumen de seguridad",
              "",
              f"### {status_icon} Estado de seguridad: **{status}**",
              "",
              "| Severidad | Hallazgos |",
              "|---|---:|",
          ]
          for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "INFO"):
              lines.append(f"| `{severity}` | {counts.get(severity, 0)} |")

          lines.extend([
              "",
              f"**Instancias detectadas:** {summary.get('total', len(findings))}",
              "",
              f"**Problemas únicos:** {summary.get('uniqueIssues', len(findings))}",
              "",
              f"**Componentes afectados:** {summary.get('affectedComponents', 0)}",
              "",
              "**Resultado de los analizadores:** " + ", ".join(
                  f"{name}={result}" for name, result in analyzer_results.items()
              ),
              "",
              "## Detalle de hallazgos",
              "",
          ])

          analysis_errors = analyzer_data.get("errors", [])
          if analysis_errors:
              lines.extend([
                  "## Errores del análisis",
                  "",
                  *[f"- {cell(error)}" for error in analysis_errors],
                  "",
              ])

          if findings:
              lines.extend([
                  "| ID | Herramienta | Categoría | Severidad | Archivo o componente | Descripción |",
                  "|---|---|---|---|---|---|",
              ])
              for finding in findings:
                  location = finding.get("file") or finding.get("component") or "No disponible"
                  lines.append(
                      f"| `{cell(finding.get('id'))}` | {cell(finding.get('tool'))} | "
                      f"{cell(finding.get('category'))} | `{cell(finding.get('severity'))}` | "
                      f"{cell(location)} | {cell(finding.get('description'))} |"
                  )
          else:
              lines.append("No se han encontrado hallazgos en los informes disponibles.")

          lines.extend([
              "",
              f"Commit analizado: `{os.environ.get('GITHUB_SHA', 'local')}`",
          ])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Bloquear si falla un analizador
        if: always() && (needs.sast.result != 'success' || needs.sca.result != 'success' || needs.container.result != 'success')
        run: |
          echo "No se permite aprobar el despliegue: al menos un analizador no terminó correctamente."
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: movie-security-report-${{ github.sha }}
          path: reports/
          retention-days: 30

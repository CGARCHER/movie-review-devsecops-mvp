services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: ${POSTGRES_USER:-movies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en Dokploy}
    volumes:
      - movie-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  app:
    build: .
    image: movie-review:dev
    expose:
      - "8080"
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/movies
      DATABASE_USER: ${POSTGRES_USER:-movies}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en Dokploy}
      DDL_AUTO: ${DDL_AUTO:-update}
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  security-dashboard:
    build:
      context: .
      dockerfile: docker/security-dashboard/Dockerfile
    image: movie-review-security-dashboard:dev
    expose:
      - "8080"
    environment:
      GITHUB_REPOSITORY: CGARCHER/movie-review-devsecops-mvp
      GITHUB_WORKFLOW_FILE: security.yml
      GITHUB_BRANCH: develop
      GH_TOKEN: ${GH_TOKEN:?Define GH_TOKEN en Dokploy}
      REPORT_ROOT: /workspace/reports
      AI_API_URL: ${AI_API_URL:-https://ai-api.cgarcher.dev/api/v1/remediations}
      AI_API_TOKEN: ${AI_API_TOKEN:?Define AI_API_TOKEN en Dokploy}
    volumes:
      - security-reports:/workspace/reports
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  backend:

volumes:
  movie-data:
  security-reports:

name: movie-review-security-tools

services:
  report-downloader:
    build:
      context: .
      dockerfile: docker/report-downloader/Dockerfile
    image: movie-review-report-downloader:local
    environment:
      GITHUB_REPOSITORY: CGARCHER/movie-review-devsecops-mvp
      GITHUB_WORKFLOW_FILE: security.yml
      GH_TOKEN_FILE: /run/secrets/github_token
      REPORT_ROOT: /workspace/reports
    secrets:
      - github_token
    volumes:
      - ./reports:/workspace/reports
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  report-updater:
    build:
      context: .
      dockerfile: docker/report-downloader/Dockerfile
    image: movie-review-report-downloader:local
    entrypoint: ["python3", "/usr/local/lib/report_api.py"]
    environment:
      GITHUB_REPOSITORY: CGARCHER/movie-review-devsecops-mvp
      GITHUB_WORKFLOW_FILE: security.yml
      GH_TOKEN_FILE: /run/secrets/github_token
      REPORT_ROOT: /workspace/reports
      AI_API_URL: ${AI_API_URL:-https://ai-api.cgarcher.dev/api/v1/remediations}
      AI_API_TOKEN_FILE: /run/secrets/ai_api_token
    secrets:
      - github_token
      - ai_api_token
    volumes:
      - ./reports:/workspace/reports
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  security-dashboard:
    build:
      context: .
      dockerfile: docker/security-dashboard/Dockerfile
    image: movie-review-security-dashboard:local
    ports:
      - "8081:8080"
    volumes:
      - ./reports:/usr/share/nginx/html/reports:ro
    depends_on:
      report-updater:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

secrets:
  github_token:
    file: ./.secrets/github_token.txt
  ai_api_token:
    file: ./.secrets/ai_api_token.txt

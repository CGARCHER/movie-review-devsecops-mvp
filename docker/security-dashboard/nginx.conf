worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    server_tokens off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

        location /reports/ {
            autoindex off;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # La API permanece dentro de la red de Docker. El navegador solo
        # accede a ella a través del mismo origen que sirve el dashboard.
        location /api/ {
            proxy_pass http://report-updater:8080/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 190s;
            proxy_send_timeout 190s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

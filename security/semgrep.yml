rules:
  - id: tfm-java-command-injection
    languages: [java]
    severity: ERROR
    message: Entrada no confiable utilizada para construir un comando del sistema.
    metadata:
      category: security
      cwe: CWE-78
    pattern: Runtime.getRuntime().exec(...)

  - id: tfm-java-hardcoded-secret
    languages: [java]
    severity: WARNING
    message: Posible secreto escrito directamente en el codigo.
    metadata:
      category: security
      cwe: CWE-798
    pattern-regex: '(?i)(password|secret|api[_-]?key)\s*=\s*"[^"\n]{8,}"'

  - id: tfm-java-weak-md5
    languages: [java]
    severity: WARNING
    message: Uso de MD5 para una operacion sensible.
    metadata:
      category: security
      cwe: CWE-327
    pattern: MessageDigest.getInstance("MD5")
